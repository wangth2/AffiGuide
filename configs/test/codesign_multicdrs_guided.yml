mode: multiple_cdrs
model:
  checkpoint: ./trained_models/codesign_multicdrs.pt
sampling:
  seed: 2022
  num_samples: 100
  sample_structure: true
  sample_sequence: true
  cdrs:
    - H_CDR1
    - H_CDR2
    - H_CDR3
    - L_CDR1
    - L_CDR2
    - L_CDR3
  task: redesign
  sample_ddg: true
  ddg_guidance_model: ddgpred
  ddg_ref: scaled
  gradient_scale_cord: 4.0
  gradient_scale_categ: 1.0
  sample_hydro: true
  hydro_prior_b: 0.8

dataset:
  test:
    type: sabdab
    summary_path: ./data/sabdab_summary_all.tsv
    chothia_dir: ./data/all_structures/chothia
    processed_dir: ./data/processed
    split: test
